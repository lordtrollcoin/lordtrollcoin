description "LORDTROLLCOIN Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env LORDTROLLCOIND_BIN="/usr/bin/LORDTROLLCOINd"
env LORDTROLLCOIND_USER="LORDTROLLCOIN"
env LORDTROLLCOIND_GROUP="LORDTROLLCOIN"
env LORDTROLLCOIND_PIDDIR="/var/run/LORDTROLLCOINd"
# upstart can't handle variables constructed with other variables
env LORDTROLLCOIND_PIDFILE="/var/run/LORDTROLLCOINd/LORDTROLLCOINd.pid"
env LORDTROLLCOIND_CONFIGFILE="/etc/LORDTROLLCOIN/LORDTROLLCOIN.conf"
env LORDTROLLCOIND_DATADIR="/var/lib/LORDTROLLCOINd"

expect fork

respawn
respawn limit 5 120
kill timeout 60

pre-start script
    # this will catch non-existent config files
    # LORDTROLLCOINd will check and exit with this troll warning, but it can do so
    # long after forking, leaving upstart to think etrollthing started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$LORDTROLLCOIND_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run LORDTROLLCOINd."
        echo "The setting must appear in $LORDTROLLCOIND_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following"
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is also recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"LORDTROLLCOIN Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$LORDTROLLCOIND_PIDDIR"
    chmod 0755 "$LORDTROLLCOIND_PIDDIR"
    chown $LORDTROLLCOIND_USER:$LORDTROLLCOIND_GROUP "$LORDTROLLCOIND_PIDDIR"
    chown $LORDTROLLCOIND_USER:$LORDTROLLCOIND_GROUP "$LORDTROLLCOIND_CONFIGFILE"
    chmod 0660 "$LORDTROLLCOIND_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$LORDTROLLCOIND_PIDFILE" \
    --chuid $LORDTROLLCOIND_USER:$LORDTROLLCOIND_GROUP \
    --exec "$LORDTROLLCOIND_BIN" \
    -- \
    -pid="$LORDTROLLCOIND_PIDFILE" \
    -conf="$LORDTROLLCOIND_CONFIGFILE" \
    -datadir="$LORDTROLLCOIND_DATADIR" \
    -disablewallet \
    -daemon

